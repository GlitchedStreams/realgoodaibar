<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Donation Bulb — Live</title>
<style>
  html, body { margin: 0; background: transparent; height: 100%; overflow: hidden; }
  canvas { width: 100vw; height: 100vh; display: block; background: transparent; }
</style>
</head>
<body>
<canvas id="rive-canvas"></canvas>

<script>
// ===== Same source of truth as the Real Good AI embed widget =====
const CONFIG = {
  campaignSlug: "ahead-of-full-steam-ahead-stream-testing",
  supabaseUrl: "https://nrqygssowwtezhjolpua.supabase.co",
  supabaseAnonKey: "sb_publishable_z0y8kNr6v0KoDrnP9KQebQ_3nNlwP9Y",
  pollIntervalMs: 90000
};
// Same-folder relative path — put this file and rgai_donation_bar_2.riv together.
const RIVE_SRC = "rgai_donation_bar_2.riv";
const VM_NAME = "DonationData";
// ===================================================================

const log = (msg) => console.log("[donation-bulb-live]", msg);

const riveScript = document.createElement("script");
riveScript.src = "https://unpkg.com/@rive-app/canvas@2.32.0";
riveScript.onload = boot;
riveScript.onerror = () => log("Failed to load the Rive runtime — check your internet connection.");
document.head.appendChild(riveScript);

function boot() {
  let riveInstance, props = null;
  let currentAmount = 0, currentTarget = 1000;

  function bindAndGetProps() {
    const vm = riveInstance.viewModelByName(VM_NAME);
    if (!vm) return log(`No ViewModel named '${VM_NAME}' in this file.`);
    const vmi = vm.defaultInstance();
    if (!vmi) return log(`'${VM_NAME}' has no default instance — check the Artboard's Default View Model setting in Rive.`);
    riveInstance.bindViewModelInstance(vmi);

    const amountProp = vmi.number("donationAmount");
    const targetProp = vmi.number("donationTarget");
    const milestoneProp = vmi.number("Milestone");
    if (!amountProp || !targetProp) return log("Bound, but donationAmount/donationTarget weren't found on it.");

    props = { amountProp, targetProp, milestoneProp };
    log("Rive ready. Starting campaign poll for slug: " + CONFIG.campaignSlug);
  }

  function tween(prop, from, to, duration = 900) {
    const start = performance.now();
    (function step(now) {
      const t = Math.min(1, (now - start) / duration);
      prop.value = from + (to - from) * (1 - Math.pow(1 - t, 3));
      if (t < 1) requestAnimationFrame(step);
    })(start);
  }

  function applyState(amount, target) {
    if (!props) return;
    tween(props.amountProp, currentAmount, amount);
    tween(props.targetProp, currentTarget, target);
    if (props.milestoneProp) props.milestoneProp.value = 0;
    currentAmount = amount;
    currentTarget = target;
  }

  riveInstance = new rive.Rive({
    src: RIVE_SRC,
    canvas: document.getElementById("rive-canvas"),
    artboard: "Artboard",
    autoplay: true,
    stateMachines: "TierCycling",
    onLoad: () => {
      riveInstance.resizeDrawingSurfaceToCanvas();
      bindAndGetProps();
      if (props) {
        tick();
        setInterval(tick, CONFIG.pollIntervalMs);
      }
    },
    onLoadError: (e) => { log("Failed to load the .riv file — see console."); console.error(e); },
  });

  function tick() {
    const url = `${CONFIG.supabaseUrl}/rest/v1/rpc/campaign_progress?p_slugs={${encodeURIComponent(CONFIG.campaignSlug)}}`;
    fetch(url, {
      headers: { apikey: CONFIG.supabaseAnonKey, Authorization: "Bearer " + CONFIG.supabaseAnonKey }
    })
      .then((res) => res.json())
      .then((rows) => {
        if (rows && rows.length) {
          applyState(rows[0].raised_cents / 100, rows[0].goal_cents / 100);
        } else {
          log("Campaign poll returned no rows for slug: " + CONFIG.campaignSlug);
        }
      })
      .catch((err) => { log("Campaign poll failed — see console."); console.error(err); });
  }
}
</script>
</body>
</html>
